# Don't touch this file otherwise your device may stop working.
# Use override.yaml to modify required settings.
# You can find a working configuration in /usr/share/kvmd/configs.default/kvmd.

kvmd:
    info:
        hw:
            ignore_past: true

    hid:
        type: otg

    atx:
        type: gpio
        device: /dev/gpiochip5
        power_led_pin: 3
        hdd_led_pin: 7
        power_switch_pin: 28
        reset_switch_pin: 29

    msd:
        type: otg

    streamer:
        h264_bitrate:
            default: 5000
        cmd:
            - "/usr/bin/ustreamer"
            - "--device=/dev/kvmd-video"
            - "--sub-device=/dev/kvmd-subdev"
            - "--persistent"
            - "--dv-timings"
            - "--format=nv12"
            - "--buffers=6"
            - "--workers=3"
            - "--quality={quality}"
            - "--desired-fps={desired_fps}"
            - "--drop-same-frames=30"
            - "--unix={unix}"
            - "--unix-rm"
            - "--unix-mode=0660"
            - "--exit-on-parent-death"
            - "--process-name-prefix={process_name_prefix}"
            - "--notify-parent"
            - "--no-log-colors"
            - "--jpeg-sink=kvmd::ustreamer::jpeg"
            - "--jpeg-sink-mode=0660"
            - "--h264-sink=kvmd::ustreamer::h264"
            - "--h264-sink-mode=0660"
            - "--h264-bitrate={h264_bitrate}"
            - "--h264-gop={h264_gop}"

    gpio:
        drivers:
            gpio_bank5:
                device: /dev/gpiochip5
                type: gpio

        scheme:
            __v3_usb_breaker__:
                driver: gpio_bank5
                pin: 19
                mode: output
                initial: true
                inverted: true
                pulse: false


media:
    memsink:
        h264:
            sink: "kvmd::ustreamer::h264"


vnc:
    memsink:
        h264:
            sink: "kvmd::ustreamer::h264"


oled:
    height: 64
    rotate: 2
